    <text x="64" y="445" fill="#acbdcf" font-size="17">Built for Fully. Not limited to Fully.</text>
    <text x="64" y="526" fill="#7e95ac" font-size="16">peacode / Open source · MIT</text>
    <rect x="510" y="94" width="628" height="402" rx="32" fill="#070d16" stroke="#476074" stroke-width="3"/>
