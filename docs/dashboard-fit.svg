<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">HA Dashboard Fit — your dashboard, a better fit</title>
  <desc id="desc">Illustration of a dark wall tablet with dashboard cards and URL settings zoom 0.85 and marginTop minus 15. Not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#172e40"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#76ead2"/><stop offset="1" stop-color="#76baff"/></linearGradient>
  </defs>
  <rect width="1200" height="590" rx="24" fill="url(#bg)"/>
